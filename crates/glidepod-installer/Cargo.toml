[package]
name = "glidepod-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
# APK inspection only needs deflate; omit the expensive Zopfli encoder.
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile.workspace = true
